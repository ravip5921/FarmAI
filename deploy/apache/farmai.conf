<VirtualHost *:80>
    ServerName farmai.cht77.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/ retry=0 timeout=300
    ProxyPassReverse / http://127.0.0.1:8000/

    # Keep this synchronized with FARMAI_UI_MAX_UPLOAD_BYTES.
    LimitRequestBody 52428800

    ErrorLog ${APACHE_LOG_DIR}/farmai-error.log
    CustomLog ${APACHE_LOG_DIR}/farmai-access.log combined
</VirtualHost>
